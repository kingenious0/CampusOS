    function doSearch(q) {
        if (!q || q.trim().length < 1) { searchResults.classList.remove('open'); return; }

        const rawQ = q.trim();
        const lq = rawQ.toLowerCase();
        const tokens = lq.split(/\s+/).filter(t => t.length > 0);
        let results = [];

        // Room/Hall code check (e.g. "ROB 018", "ESA Room 17", "CBT 026", "FBR 28", "NFB Rm 05")
        const roomCodeMatch = rawQ.match(/^([a-zA-Z]+)\s*(?:room|rm)?\s*([0-9]+[a-zA-Z]?)$/i);
        let queryBuildingCode = null;
        let queryRoomNum = null;
        if (roomCodeMatch) {
            queryBuildingCode = roomCodeMatch[1].toUpperCase();
            queryRoomNum = roomCodeMatch[2].toLowerCase();
        }

        // Expanded query tokens with synonyms
        let expandedTokens = [...tokens];
        tokens.forEach(t => {
            if (SEARCH_SYNONYMS[t]) {
                SEARCH_SYNONYMS[t].forEach(syn => {
                    expandedTokens.push(...syn.split(/\s+/));
                });
            }
        });

        // 1. Search Academic & Administrative Staff (peopleData)
        if (peopleData && peopleData.length) {
            peopleData.forEach(p => {
                let score = 0;
                const name = (p.name || '').toLowerCase();
                const title = (p.title || '').toLowerCase();
                const pos = (p.position || '').toLowerCase();
                const dept = (p.department || '').toLowerCase();
                const fac = (p.faculty || '').toLowerCase();
                const bCode = (p.location?.building || '').toUpperCase();
                const room = (p.location?.room || '').toLowerCase();
                const pTokens = `${name} ${title} ${pos} ${dept} ${fac} ${bCode} ${room}`;

                // Room code direct boost (e.g. "ROB 018", "ESA 17")
                if (queryBuildingCode && queryRoomNum) {
                    const normB = bCode === queryBuildingCode;
                    const cleanPRoom = room.replace(/[^0-9]/g, '');
                    const cleanQRoom = queryRoomNum.replace(/[^0-9]/g, '');
                    const normR = room === queryRoomNum || (cleanPRoom && cleanQRoom && parseInt(cleanPRoom) === parseInt(cleanQRoom));
                    if (normB && normR) score += 220;
                }

                // Full query exact/prefix match on name
                if (name === lq) score += 180;
                else if (name.startsWith(lq)) score += 130;
                else if (name.includes(lq)) score += 85;

                // Department / Faculty exact match
                if (dept === lq || fac === lq) score += 110;
                else if (dept.includes(lq) || fac.includes(lq)) score += 70;

                // Multi-token evaluation across all query tokens
                let tokensMatched = 0;
                tokens.forEach(tok => {
                    if (tok.length < 2) return;
                    if (name.includes(tok)) {
                        score += 40;
                        tokensMatched++;
                    } else if (title.includes(tok) || pos.includes(tok)) {
                        score += 30;
                        tokensMatched++;
                    } else if (dept.includes(tok) || fac.includes(tok)) {
                        score += 25;
                        tokensMatched++;
                    } else if (bCode.toLowerCase() === tok || room.includes(tok)) {
                        score += 35;
                        tokensMatched++;
                    } else if (expandedTokens.some(et => pTokens.includes(et))) {
                        score += 18;
                        tokensMatched++;
                    }
                });

                if (tokens.length > 1 && tokensMatched >= tokens.length) {
                    score += 60; // multi-token consensus boost
                }

                if (score > 0) {
                    const buildingObj = getBuildingForCode(p.location?.building, p);
                    results.push({ type: 'staff', data: p, building: buildingObj, score });
                }
            });
        }

        // 2. Search Buildings
        buildingsData.forEach(b => {
            let score = 0;
            const name = b.name.toLowerCase();
            const shortName = (b.shortName || '').toLowerCase();
            const desc = (b.description || '').toLowerCase();
            const keywords = b.keywords || [];
            const bCode = (b.shortName || '').toUpperCase();

            if (name === lq || shortName === lq) score += 100;
            else if (name.startsWith(lq) || shortName.startsWith(lq)) score += 60;
            else if (name.includes(lq) || shortName.includes(lq)) score += 30;
            if (desc.includes(lq)) score += 10;
            if (keywords.some(k => k.toLowerCase().includes(lq))) score += 50;

            tokens.forEach(tok => {
                if (shortName === tok || name.includes(tok)) score += 20;
                if (keywords.some(k => k.toLowerCase().includes(tok))) score += 15;
            });

            if (score > 0) results.push({ type: 'building', data: b, score });

            // 3. Search Services within this building
            if (b.services) {
                b.services.forEach(s => {
                    let sScore = 0;
                    const sName = s.name.toLowerCase();
                    const sKeywords = s.keywords || [];
                    if (sName === lq) sScore += 110;
                    else if (sName.startsWith(lq)) sScore += 70;
                    else if (sName.includes(lq)) sScore += 40;
                    if (sKeywords.some(k => k.toLowerCase().includes(lq))) sScore += 60;

                    if (sScore > 0) results.push({ type: 'service', data: s, building: b, score: sScore });
                });
            }

            // 4. Search Rooms within this building
            if (b.rooms) {
                b.rooms.forEach(r => {
                    let rScore = 0;
                    const rName = r.number.toLowerCase();
                    const rKeywords = r.keywords || [];
                    const rOccupant = (r.occupant || '').toLowerCase();
                    const isLecture = rName.includes('lecture') || rName.includes('hall') || rName.includes('lab');

                    // Match room code pattern (e.g. "ROB 018")
                    if (queryBuildingCode && queryRoomNum) {
                        const normB = bCode === queryBuildingCode || b.name.toUpperCase().includes(queryBuildingCode);
                        const cleanR = rName.replace(/[^0-9]/g, '');
                        const cleanQ = queryRoomNum.replace(/[^0-9]/g, '');
                        if (normB && (rName.includes(queryRoomNum) || (cleanR && cleanQ && parseInt(cleanR) === parseInt(cleanQ)))) {
                            rScore += 210;
                        }
                    }

                    if (rName === lq) rScore += 120;
                    else if (rName.startsWith(lq)) rScore += 80;
                    else if (rName.includes(lq)) rScore += 40;

                    if (rOccupant && rOccupant.includes(lq)) rScore += 90;

                    // Flexible room number matching
                    if (!rScore && lq.length > 0) {
                        const cleanNum = rName.replace(/[^0-9]/g, '');
                        const cleanQuery = lq.replace(/[^0-9]/g, '');
                        if (cleanNum && cleanQuery && parseInt(cleanNum) === parseInt(cleanQuery)) rScore += 100;
                    }

                    if (rKeywords.some(k => k.toLowerCase().includes(lq))) rScore += 70;
                    if (rScore > 0 && isLecture) rScore += 25;

                    if (rScore > 0) results.push({ type: 'room', data: r, building: b, score: rScore });
                });
            }
        });

        // Deduplicate and sort
        const seen = new Set();
        const unique = [];
        results.sort((a, b) => b.score - a.score);
        for (const item of results) {
            const key = item.type === 'staff' ? `staff_${item.data.id}` :
                        item.type === 'room' ? `room_${item.building.id}_${item.data.number}` :
                        item.type === 'service' ? `service_${item.building.id}_${item.data.name}` :
                        `building_${item.data.id}`;
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(item);
            }
        }

        renderResults(unique.slice(0, 15), q);
    }

    // Keyboard navigation for search results
    searchInput.addEventListener('keydown', e => {
        const items = [...searchResults.querySelectorAll('.result-item')];
        const focused = searchResults.querySelector('.result-item:focus');
        if (!items.length) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            const next = focused ? items[items.indexOf(focused) + 1] : items[0];
            next?.focus();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = focused ? items[items.indexOf(focused) - 1] : items[items.length - 1];
            prev?.focus();
        } else if (e.key === 'Escape') {
            searchResults.classList.remove('open');
            searchInput.blur();
        }
    });

    function highlight(text, q) {
        if (!text) return '';
        if (!q) return escapeHtml(text);
        const i = text.toLowerCase().indexOf(q.toLowerCase());
        if (i < 0) return escapeHtml(text);
        return escapeHtml(text.slice(0,i)) + `<mark style="background:#fef08a;border-radius:2px;padding:0 2px">${escapeHtml(text.slice(i,i+q.length))}</mark>` + escapeHtml(text.slice(i+q.length));
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ══════════════════════════════════════════
    //  GPS LOCATION & TRACKING
    // ══════════════════════════════════════════
    let prevLatLng = null;
    let userBearing = null;
    let watchId = null;
    let settingManualLocation = false;  // referenced by map click handler

    // Detect if we are on HTTP (not HTTPS) — geolocation is blocked on HTTP
    // in Chrome/Edge/Safari on Android/iOS since 2016.
    const isHttp = location.protocol === 'http:';

    function tryGeolocation() {
        if (!navigator.geolocation) {
            showLocationUnavailable();
            return;
        }

        // Some browsers still allow geolocation on localhost over HTTP.
        // We attempt it; if the error code is PERMISSION_DENIED we show help.
        navigator.geolocation.getCurrentPosition(
            pos => {
                const { latitude: lat, longitude: lng } = pos.coords;
                userLatLng = { lat, lng };
                placeUserMarker(lat, lng, pos.coords.heading);
                map.flyTo({ center: [lng, lat], zoom: 18, duration: 800 });
                startWatching();
            },
            err => {
                if (err.code === 1 /* PERMISSION_DENIED */ && isHttp) {
                    // Browser blocks GPS on HTTP — offer manual picker
                    showLocationBlockedSheet();
                } else if (err.code === 2 /* POSITION_UNAVAILABLE */) {
                    showToast('GPS signal lost — try again outside');
                } else if (err.code === 3 /* TIMEOUT */) {
                    showToast('Location timed out — try again');
                } else {
                    showLocationUnavailable();
                }
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function startWatching() {
        if (watchId !== null) return;
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude: lat, longitude: lng, heading } = pos.coords;
            if (prevLatLng) {
                const dLng = (lng - prevLatLng.lng) * Math.PI / 180;
                const lat1r = prevLatLng.lat * Math.PI / 180;
                const lat2r = lat * Math.PI / 180;
                const y = Math.sin(dLng) * Math.cos(lat2r);
                const x = Math.cos(lat1r) * Math.sin(lat2r) - Math.sin(lat1r) * Math.cos(lat2r) * Math.cos(dLng);
                userBearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            }
            prevLatLng = { lat, lng };
            userLatLng = { lat, lng };
            placeUserMarker(lat, lng, heading ?? userBearing);
            if (navState.active) liveNavUpdate(lat, lng);
        }, null, { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });
    }

    function showLocationUnavailable() {
        showToast('Location unavailable — tap 📍 to set manually');
    }

        openSheet(`

        closeSheet();
        settingManualLocation = true;
        document.getElementById('map').style.cursor = 'crosshair';

    }

    function setManualLocation(lat, lng) {
        settingManualLocation = false;
        document.getElementById('map').style.cursor = '';
        userLatLng = { lat, lng };
        placeUserMarker(lat, lng, null);

        // If there is a pending navigation, resume it automatically
        if (_route.steps.length && _route.destName) {
            setTimeout(() => beginLiveNav(), 900);
        }

    function setupNavigation() {
        document.getElementById('btnLocate').addEventListener('click', () => {
            tryGeolocation();
        });

        // Auto-try GPS on load (works on localhost)
        tryGeolocation();
    }

    function placeUserMarker(lat, lng, bearing) {
        const hasBearing = bearing !== null && bearing !== undefined;
        const rot = hasBearing ? `rotate(${Math.round(bearing)}deg)` : 'none';
        
        if (!userMarker) {
            const el = document.createElement('div');
            el.className = 'user-marker-container';
            el.innerHTML = `<div class="user-pin-wrap${hasBearing ? ' has-bearing' : ''}">
                <div class="user-arrow" style="transform:translateX(-50%) ${rot}"></div>
                <div class="user-dot"></div>
            </div>`;
            
            userMarker = new mapboxgl.Marker({ element: el, zIndexOffset: 2000 })
                .setLngLat([lng, lat])
                .addTo(map);
        } else {
            userMarker.setLngLat([lng, lat]);
            const el = userMarker.getElement();
            const arrow = el.querySelector('.user-arrow');
            if (arrow) arrow.style.transform = `translateX(-50%) ${rot}`;
        }
    }

    // ══════════════════════════════════════════
    //  ROUTING — OSRM  (with Live Navigation)
    // ══════════════════════════════════════════

    // Live navigation state
    const navState = {
        active: false,
        steps: [],
        currentStep: 0,
        destLat: 0, destLng: 0, destName: '',
        totalDist: 0
    };

    async function startRoute(destLat, destLng, destName) {
        clearRouteLines();
        stopLiveNav();
        _route.destLat = destLat; _route.destLng = destLng; _route.destName = destName;
        _route.steps = [];
        _route.geometry = null;
        const hasGPS = !!userLatLng;
        const origin = userLatLng || { lat: CAMPUS.lat, lng: CAMPUS.lng };
        const modeLabel = travelMode === 'driving' ? 'driving' : 'walking';
        const originLabel = hasGPS ? '' : '<p style="color:var(--amber);font-size:12px;margin-top:-6px;display:flex;align-items:center;gap:6px"><i class="fas fa-exclamation-triangle"></i> GPS not set — estimating from Campus Center</p>';
        
        openSheet(`<div class="loading-state"><div class="spin"></div><p>Finding shortest ${modeLabel} route to <strong>${destName}</strong>…</p></div>`);

        try {
            const profile = travelMode === 'driving' ? 'driving' : 'walking';
            const url = `https://api.mapbox.com/directions/v5/mapbox/${profile}/` +
                `${origin.lng},${origin.lat};${destLng},${destLat}` +
                `?overview=full&geometries=geojson&steps=true&alternatives=false&access_token=${TOKEN}`;
            const res  = await fetch(url);
            const data = await res.json();

            if (data.code !== 'Ok') throw new Error(data.message || 'No route');

            const route    = data.routes[0];
            const distance = route.distance;
            const duration = route.duration;
            const coords   = route.geometry.coordinates; // MapLibre wants [lng, lat]
            const rawSteps = route.legs[0].steps;

            _route.steps = rawSteps;
            _route.geometry = route.geometry;

            // 3D Cesium Bridge: render active navigation route on 3D terrain
            if (window.ViewControllerModule && window.ViewControllerModule.getMode() === '3D') {
                window.CesiumViewerModule?.renderRoute(coords);
            }

            // Route Data Source
            if (map.getSource('route')) {
                map.getSource('route').setData(route.geometry);
            } else {
                map.addSource('route', { type: 'geojson', data: route.geometry });
            }

            // Route Layers
            const routeColor = travelMode === 'driving' ? '#f59e0b' : '#4338ca';
            if (!map.getLayer('route-line')) {
                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': routeColor, 'line-width': 6, 'line-opacity': 0.8 }
                });
                map.addLayer({
                    id: 'route-dash',
                    type: 'line',
                    source: 'route',
                    paint: { 'line-color': '#fff', 'line-width': 2, 'line-dasharray': [2, 4], 'line-opacity': 0.5 }
                });
            } else {
                map.setPaintProperty('route-line', 'line-color', routeColor);
            }

            // Destination Marker
            const destEl = document.createElement('div');
            destEl.className = 'dest-pin';
            if (markers['dest']) markers['dest'].marker.remove();
            
            const destMarker = new mapboxgl.Marker({ element: destEl })
                .setLngLat([destLng, destLat])
                .addTo(map);
            markers['dest'] = { marker: destMarker };

            // Zoom to route
            const bounds = coords.reduce((acc, coord) => acc.extend(coord), new mapboxgl.LngLatBounds(coords[0], coords[0]));
            map.fitBounds(bounds, { padding: 80 });

            // ALL steps shown (not just 10)
            const stepsHtml = rawSteps.map((s, i) => {
                const manIcon = getManeuverIcon(s.maneuver.type, s.maneuver.modifier);
                const dist    = s.distance > 0 ? `<span style="color:var(--muted);margin-left:auto;font-size:11px">${formatDist(s.distance)}</span>` : '';
                const name    = s.name || stepLabel(s.maneuver.type, s.maneuver.modifier);
                return `<div class="step-item" id="step-${i}"><i class="fas ${manIcon}"></i><span>${name}</span>${dist}</div>`;
            }).join('');

            const modeIcon = travelMode === 'driving' ? 'fa-car' : 'fa-person-walking';
            const timeLabel = travelMode === 'driving' ? 'Drive time' : 'Walk time';

            // NOTE: beginLiveNav() is called with NO args — it reads from the global _route object
            openSheet(`
                <div class="route-info">
                    <div class="route-dest-header">
                        <div style="font-size:11px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px">
                            <i class="fas fa-location-dot" style="margin-right:4px"></i> Destination & Indoor Breadcrumbs
                        </div>
                        <div style="font-size:13.5px;font-weight:700;color:var(--text);margin-top:3px">${destName}</div>
                    </div>
                    <div class="route-cards">
                        <div class="route-card">
                            <span class="val">${formatDist(distance)}</span>
                            <span class="lbl">Distance</span>
                        </div>
                        <div class="route-card">
                            <span class="val">${Math.ceil(duration/60)} min</span>
                            <span class="lbl">${timeLabel}</span>
                        </div>
                    </div>
                    ${rawSteps.length ? `<div class="steps-list" id="stepsList" style="max-height: 200px; overflow-y: auto;">${stepsHtml}</div>` : ''}
                    <div class="sheet-actions">
                        <button class="action-btn btn-nav-live" onclick="beginLiveNav()">
                            <i class="fas fa-location-arrow"></i> Go
                        </button>
                        <button class="action-btn btn-share" onclick="clearRoute()">
                            <i class="fas fa-xmark"></i> Clear
                        </button>
                    </div>
                </div>
            `);

        } catch(e) {
            console.log('Falling back to Offline Router...', e);
            const offline = OfflineRouter.compute(origin.lat, origin.lng, destLat, destLng);
            
            if (!offline) {
                showToast('Unable to find a connected walking route on the campus network.');
                closeSheet();
                return;
            }

            // SUCCESS: Offline graph route found!
            const { distance, duration, geometry, steps } = offline;
            _route.steps = steps;
            _route.geometry = geometry;

            // 3D Cesium Bridge: render active navigation route on 3D terrain
            if (window.ViewControllerModule && window.ViewControllerModule.getMode() === '3D') {
                window.CesiumViewerModule?.renderRoute(geometry.coordinates);
            }

            if (map.getSource('route')) map.getSource('route').setData(geometry);
            else map.addSource('route', { type: 'geojson', data: geometry });

            if (!map.getLayer('route-line')) {
                map.addLayer({ id: 'route-line', type: 'line', source: 'route', paint: { 'line-color': '#4338ca', 'line-width': 6, 'line-opacity': 0.8 } });
            }
            
            const bounds = geometry.coordinates.reduce((acc, coord) => acc.extend(coord), new mapboxgl.LngLatBounds(geometry.coordinates[0], geometry.coordinates[0]));
            map.fitBounds(bounds, { padding: 80 });

            const stepsHtml = steps.map((s, i) => {
                const manIcon = getManeuverIcon(s.maneuver.type, s.maneuver.modifier);
                const distStr = s.distance > 0 ? `<span style="color:var(--muted);margin-left:auto;font-size:11px">${formatDist(s.distance)}</span>` : '';
                return `<div class="step-item" id="step-${i}"><i class="fas ${manIcon}"></i><span>${s.name}</span>${distStr}</div>`;
            }).join('');

            openSheet(`
                <div class="route-info">
                    <div class="route-dest-header">
                        <div style="font-size:11px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px">
                            <i class="fas fa-location-dot" style="margin-right:4px"></i> Destination & Indoor Breadcrumbs
                        </div>
                        <div style="font-size:13.5px;font-weight:700;color:var(--text);margin-top:3px">${destName}</div>
                    </div>
                    <p style="background:#eef2ff; color:#4338ca; padding:8px; border-radius:8px; font-size:12px; margin-bottom:12px; border:1px solid #c7d2fe">
                        <i class="fas fa-wifi-slash"></i> <strong>Offline Mode:</strong> Using campus path network
                    </p>
                    <div class="route-cards">
                        <div class="route-card"><span class="val">${formatDist(distance)}</span><span class="lbl">Distance</span></div>
                        <div class="route-card"><span class="val">${Math.ceil(duration/60)} min</span><span class="lbl">Walk time</span></div>
                    </div>
                    <div class="steps-list" style="max-height: 180px; overflow-y: auto;">${stepsHtml}</div>
                    <div class="sheet-actions">
                        <button class="action-btn btn-nav-live" onclick="beginLiveNav()"><i class="fas fa-location-arrow"></i> Go</button>
                        <button class="action-btn btn-share" onclick="clearRoute()"><i class="fas fa-xmark"></i> Clear</button>
                    </div>
                </div>
            `);
        }
    }

    // ── LIVE NAVIGATION ENGINE ─────────────────
    // Called with NO arguments — reads state from global _route object
    function beginLiveNav() {
        const { steps, destLat, destLng, destName } = _route;
        if (!steps || steps.length === 0) {
            showToast('Get directions first'); return;
        }
        if (!userLatLng) {
            // GPS not yet set — prompt for manual location; will auto-resume after
            openSheet(`
                <div style="padding:16px 0;text-align:center">
                    <div style="font-size:36px;margin-bottom:8px">📍</div>
                    <h3 style="font-size:15px;margin-bottom:6px">Set Your Location First</h3>
                    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">
                        GPS unavailable on HTTP. Tap <strong>Set My Location</strong>, then
                        tap exactly where you are standing on the map.
                        Navigation will start automatically.
                    </p>
                    <button class="action-btn btn-dir" style="width:100%;margin-bottom:8px"
                        onclick="enableManualLocationPicker()">
                        <i class="fas fa-map-pin"></i> Set My Location
                    </button>
                    <button class="action-btn btn-share" style="width:100%" onclick="closeSheet()">
                        <i class="fas fa-xmark"></i> Cancel
                    </button>
                </div>
            `);
            return;
        }
        navState.active     = true;
        navState.steps      = steps;
        navState.currentStep = 0;
        navState.destLat    = destLat;
        navState.destLng    = destLng;
        navState.destName   = destName;
        navState.totalDist  = steps.reduce((sum, s) => sum + s.distance, 0);

        closeSheet();
        showNavHUD();
        updateNavStep(0);
        // Pan to user with navigation zoom
        map.flyTo({ center: [userLatLng.lng, userLatLng.lat], zoom: 18, duration: 1000 });
        showToast('Navigation started!');
    }

    function liveNavUpdate(lat, lng) {
        if (!navState.active || !navState.steps.length) return;

        const step = navState.steps[navState.currentStep];
        if (!step) { arriveAtDestination(); return; }

        // Distance to step endpoint
        const inter = step.intersections?.at(-1);
        if (!inter) return;
        const [sLng, sLat] = inter.location;
        const dToStep = haversine(lat, lng, sLat, sLng);

        // Distance to destination
        const dToDest = haversine(lat, lng, navState.destLat, navState.destLng);

        // Update HUD distance badge
        document.getElementById('navDistVal').textContent = formatDist(dToStep);

        // Progress bar
        const walked = navState.totalDist - navState.steps.slice(navState.currentStep).reduce((s,x)=>s+x.distance,0);
        const pct = Math.min(100, (walked / navState.totalDist) * 100);
        document.getElementById('navProgressFill').style.width = pct + '%';

        // Detect off-route (> 35 m from step end)
        const distToRoute = pointToRouteDistance(lat, lng, step);
        if (distToRoute > 35) {
            showRerouteBar();
            setTimeout(() => startRoute(navState.destLat, navState.destLng, navState.destName), 2000);
            stopLiveNav();
            return;
        }

        // Advance step when within 12 m of step endpoint
        if (dToStep < 12) {
            const next = navState.currentStep + 1;
            if (next >= navState.steps.length || dToDest < 10) {
                arriveAtDestination();
            } else {
                navState.currentStep = next;
                updateNavStep(next);
            }
        }

        // Highlight current step in sheet
        document.querySelectorAll('.step-item').forEach((el, i) => {
            el.classList.toggle('active-step', i === navState.currentStep);
        });
        // Scroll step into view
        document.getElementById(`step-${navState.currentStep}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function updateNavStep(idx) {
        const step = navState.steps[idx];
        if (!step) return;
        const type     = step.maneuver.type;
        const modifier = step.maneuver.modifier;
        const ico      = getManeuverIcon(type, modifier);
        const label    = step.name || stepLabel(type, modifier);
        const nextStep = navState.steps[idx + 1];
        const nextText = nextStep ? `Then: ${nextStep.name || stepLabel(nextStep.maneuver.type, nextStep.maneuver.modifier)}` : 'Arriving at entrance';

        document.getElementById('navTurnIco').className = `fas ${ico}`;
        document.getElementById('navInstruction').textContent = label;
        // Keep indoor breadcrumbs visible in the HUD banner so freshers always know where to head once inside
        document.getElementById('navSub').textContent = navState.destName ? `📍 ${navState.destName}` : nextText;
        document.getElementById('navDistVal').textContent = formatDist(step.distance);
    }

    function arriveAtDestination() {
        showToast('🎉 Arrived at ' + (navState.destName || 'building entrance'));
        document.getElementById('navInstruction').textContent = 'Arrived at building entrance!';
        document.getElementById('navSub').textContent = navState.destName ? `📍 ${navState.destName}` : 'You have arrived!';
        document.getElementById('navTurnIco').className = 'fas fa-flag-checkered';
        document.getElementById('navDistVal').textContent = '0 m';
        document.getElementById('navProgressFill').style.width = '100%';
        setTimeout(() => stopNavigation(), 3500);
    }

    function showNavHUD() {
        document.getElementById('navHud').classList.add('active');
        if (navState.destName) {
            document.getElementById('navSub').textContent = `📍 ${navState.destName}`;
        }
        // Mobile-first: slide the search bar and filter chips up fully out of the way for a 100% distraction-free nav map
        if (window.innerWidth < 768) {
            document.querySelector('.top-bar').style.transform = 'translateY(-150%)';
            document.querySelector('.filter-chips').style.transform = 'translateY(-150%)';
        }
    }

    function stopLiveNav() {
        navState.active = false;
        document.getElementById('navHud').classList.remove('active');
        document.querySelector('.top-bar').style.transform = '';
        document.querySelector('.filter-chips').style.transform = '';
        document.getElementById('navProgressFill').style.width = '0%';
    }

    // Single entry-point for stopping navigation from ANY control
    function stopNavigation() {
        stopLiveNav();
        clearRoute();
        showToast('Navigation ended');
    }

    function showRerouteBar() {
        const bar = document.getElementById('rerouteBar');
        bar.classList.add('show');
        setTimeout(() => bar.classList.remove('show'), 3500);
    }

    // ── DISTANCE TO ACTIVE ROUTE (Snapping & Reroute Evaluation) ──
    // Uses SpatialSnapper equirectangular segment projection when route geometry is available
    function pointToRouteDistance(lat, lng, step) {
        if (_route.geometry?.coordinates?.length >= 2 && window.SpatialSnapper) {
            const coords = _route.geometry.coordinates;
            let minD = Infinity;
            for (let i = 0; i < coords.length - 1; i++) {
                const p = SpatialSnapper.projectPointOnSegment(lat, lng, coords[i][1], coords[i][0], coords[i+1][1], coords[i+1][0]);
                if (p.distanceMeters < minD) minD = p.distanceMeters;
            }
            return minD;
        }
        if (!step.intersections?.length) return 0;
        let minDist = Infinity;
        step.intersections.forEach(inter => {
            const [iLng, iLat] = inter.location;
            minDist = Math.min(minDist, haversine(lat, lng, iLat, iLng));
        });
        return minDist;
    }

    // Both the HUD X button and the pill call stopNavigation()
    document.getElementById('navStopBtn').addEventListener('click', stopNavigation);

    function clearRoute() {
        clearRouteLines();
        closeSheet();
    }

    function clearRouteLines() {
        if (map.getLayer('route-line')) map.removeLayer('route-line');
        if (map.getLayer('route-dash')) map.removeLayer('route-dash');
        if (map.getSource('route')) map.removeSource('route');
        
        if (markers['dest']) {
            markers['dest'].marker.remove();
            delete markers['dest'];
        }

        _route.steps = [];
        _route.geometry = null;
        _route.destLat = 0;
        _route.destLng = 0;
        _route.destName = '';

        if (window.CesiumViewerModule?.clearRoute) {
            window.CesiumViewerModule.clearRoute();
        }
    }


    function getManeuverIcon(type, modifier) {
        if (type === 'turn') {
            if (modifier === 'sharp right')    return 'fa-turn-right';
            if (modifier === 'right')           return 'fa-turn-right';
            if (modifier === 'slight right')    return 'fa-arrow-turn-right';
            if (modifier === 'sharp left')      return 'fa-turn-left';
            if (modifier === 'left')            return 'fa-turn-left';
            if (modifier === 'slight left')     return 'fa-arrow-turn-left';
            if (modifier === 'uturn')           return 'fa-arrow-rotate-left';
        }
        if (type === 'new name')    return 'fa-arrow-up';
        if (type === 'depart')      return 'fa-person-walking';
        if (type === 'arrive')      return 'fa-flag-checkered';
        if (type === 'roundabout')  return 'fa-rotate-right';
        if (type === 'continue')    return 'fa-arrow-up';
        if (type === 'merge')       return 'fa-code-merge';
        if (type === 'fork') {
            if (modifier?.includes('right')) return 'fa-code-fork';
            return 'fa-code-fork';
        }
        return 'fa-arrow-up';
    }

    function stepLabel(type, modifier) {
        if (type === 'turn') {
            if (modifier?.includes('right')) return 'Turn right';
            if (modifier?.includes('left'))  return 'Turn left';
            if (modifier === 'uturn')        return 'Make a U-turn';
        }
        if (type === 'depart')     return 'Start walking';
        if (type === 'arrive')     return 'You have arrived';
        if (type === 'roundabout') return 'Enter roundabout';
        if (type === 'continue')   return 'Continue straight';
        if (type === 'merge')      return 'Merge onto path';
        if (type === 'new name')   return 'Continue';
        if (type === 'fork') {
            if (modifier?.includes('right')) return 'Keep right';
            return 'Keep left';
        }
        return 'Continue';
    }

    // ══════════════════════════════════════════
    //  SHARE
    // ══════════════════════════════════════════
    function shareLocation(name, lat, lng) {
        const url = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}&zoom=18`;
        if (navigator.share) {
            navigator.share({ title: name + ' – AAMUSTED CampusOS', url });
        } else {
            navigator.clipboard?.writeText(url);
            showToast('Link copied to clipboard');
        }
    }

    // ══════════════════════════════════════════
    //  LAYER TOGGLE
    // ══════════════════════════════════════════
    let isSatellite = false;
    function initLayerToggle() {
        const btn = document.getElementById('btnLayers');
        if (!btn) return;
        
        btn.addEventListener('click', () => {
            if (!navigator.onLine && isSatellite) {
                showToast('Satellite view requires internet connection');
                return;
            }

            isSatellite = !isSatellite;
            const style = isSatellite ? 'mapbox://styles/mapbox/satellite-streets-v12' : (isDarkTheme ? 'mapbox://styles/mapbox/dark-v11' : 'mapbox://styles/mapbox/streets-v12');
            
            // ELITE RE-RENDER: setStyle wipes all data, we must restore route and buildings
            map.once('styledata', () => {
                add3DBuildings();
                // Restore active route if it exists
                if (_route.geometry) {
                    if (map.getSource('route')) {
                        map.getSource('route').setData(_route.geometry);
                    } else {
                        map.addSource('route', { type: 'geojson', data: _route.geometry });
                    }
                    
                    const routeColor = travelMode === 'driving' ? '#f59e0b' : '#4338ca';
                    if (!map.getLayer('route-line')) {
                        map.addLayer({
                            id: 'route-line', type: 'line', source: 'route',
                            layout: { 'line-join': 'round', 'line-cap': 'round' },
                            paint: { 'line-color': routeColor, 'line-width': 6, 'line-opacity': 0.8 }
                        });
                        map.addLayer({
                            id: 'route-dash', type: 'line', source: 'route',
                            paint: { 'line-color': '#fff', 'line-width': 2, 'line-dasharray': [2, 4], 'line-opacity': 0.5 }
                        });
                    }
                }
            });
            
            map.setStyle(style);
            showToast(isSatellite ? '🛰 Satellite view' : '🗺 Street map view');
        });
    }

    // ══════════════════════════════════════════
    //  TOAST
    // ══════════════════════════════════════════
    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ══════════════════════════════════════════
    //  OFFLINE DETECTION
    // ══════════════════════════════════════════
    window.addEventListener('offline', () => document.body.classList.add('offline'));
    window.addEventListener('online',  () => document.body.classList.remove('offline'));
    if (!navigator.onLine) document.body.classList.add('offline');

    // ══════════════════════════════════════════
    //  BOOT
    // ══════════════════════════════════════════
    OfflineRouter.init(); // Init local prepared routing graph immediately (100% offline capable)
    initMap();
    loadBuildings();

    // Expose minimal CampusOS bridge for 3D viewer & view controller
    window.CampusOS = {
        getMap: () => map,
        getBuildingsData: () => buildingsData,
        getTypeCfg: () => TYPE_CFG,
        getCampusCenter: () => CAMPUS,
        showBuilding: (b) => showBuilding(b),
        showStaff: (p) => showStaff(p),
        showRoom: (r, b) => showRoom(r, b),
        showService: (s, b) => showService(s, b),
        closeSheet: () => closeSheet(),
        showToast: (msg) => showToast(msg),
        getActiveRoute: () => _route
    };
    window.showBuilding = showBuilding;
    window.showStaff = showStaff;
    window.showRoom = showRoom;
    window.showService = showService;

    if (window.ViewControllerModule) {
        window.ViewControllerModule.init();
    }

    // Dynamic zoom controls (works for both 2D Mapbox & 3D Cesium)
    window.handleZoomIn = function() {
        if (window.ViewControllerModule && window.ViewControllerModule.getMode() === '3D') {
            window.CesiumViewerModule?.zoomIn();
        } else if (map) {
            map.zoomIn();
        }
    };

    window.handleZoomOut = function() {
        if (window.ViewControllerModule && window.ViewControllerModule.getMode() === '3D') {
            window.CesiumViewerModule?.zoomOut();
        } else if (map) {
            map.zoomOut();
        }
    };

    // Register Service Worker for offline with auto-refresh on update
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            reg.update();
            reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        // Background update finished, new content ready
                    }
                };
            };
        }).catch(() => {});

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                window.location.reload();
                refreshing = true;
            }
        });
    }
